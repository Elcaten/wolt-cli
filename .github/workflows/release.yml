name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package release artifacts
        shell: bash
        run: |
          set -euo pipefail

          out_dir="dist/${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "${out_dir}"

          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "${out_dir}/wolt" ./cmd/wolt

          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
            go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
            -o "${out_dir}/wolt-mcp" ./cmd/wolt-mcp

          archive_name="wolt_${GITHUB_REF_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          tar -C "${out_dir}" -czf "dist/${archive_name}" "wolt" "wolt-mcp"

      - name: Verify embedded release version
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail

          wolt_version="$(dist/linux-amd64/wolt --version | tr -d '\r\n')"
          mcp_version="$(dist/linux-amd64/wolt-mcp --version | tr -d '\r\n')"

          for actual in "${wolt_version}" "${mcp_version}"; do
            if [ "${actual}" != "${GITHUB_REF_NAME}" ]; then
              echo "binary --version mismatch: expected '${GITHUB_REF_NAME}', got '${actual}'"
              exit 1
            fi
          done

      - name: Upload platform archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/wolt_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Consolidate release archives
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          find artifacts -type f -name "*.tar.gz" -exec cp {} dist/ \;

          archive_count="$(find dist -maxdepth 1 -type f -name "*.tar.gz" | wc -l | tr -d ' ')"
          if [ "${archive_count}" -eq 0 ]; then
            echo "No release archives found."
            exit 1
          fi

      - name: Package skill archive
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v zip >/dev/null 2>&1; then
            echo "zip command is required but not available."
            exit 1
          fi

          skill_dir="skills/wolt-cli"
          if [ ! -d "${skill_dir}" ]; then
            echo "Skill directory not found: ${skill_dir}"
            exit 1
          fi

          skill_archive="wolt-cli_skill_${GITHUB_REF_NAME}.zip"
          (
            cd skills/wolt-cli
            zip -r "../../dist/${skill_archive}" .
          )

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          (
            cd dist
            shopt -s nullglob
            archives=(./*.tar.gz ./*.zip)
            if [ "${#archives[@]}" -eq 0 ]; then
              echo "No archives found for checksum generation."
              exit 1
            fi
            sha256sum "${archives[@]}" > SHA256SUMS
          )

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"

          {
            echo "# ${CURRENT_TAG}"
            echo
            if [ -n "${PREV_TAG}" ]; then
              echo "## Changelog (${PREV_TAG}..${CURRENT_TAG})"
              echo
              git log "${PREV_TAG}..${CURRENT_TAG}" --pretty=format:'- %s (%h)'
              echo
              echo
              echo "[Compare ${PREV_TAG}...${CURRENT_TAG}](${REPO_URL}/compare/${PREV_TAG}...${CURRENT_TAG})"
            else
              echo "## Changelog (initial release)"
              echo
              git log "${CURRENT_TAG}" --pretty=format:'- %s (%h)'
            fi
            echo
            echo
            echo "## Artifacts"
            echo
            echo "- \`SHA256SUMS\` contains checksums for all release archives."
            echo "- \`wolt-cli_skill_${CURRENT_TAG}.zip\` contains the AI agent skill bundle."
            echo "- Container image: \`ghcr.io/mekedron/wolt-mcp:${CURRENT_TAG}\`"
          } > RELEASE_NOTES.md

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

  docker:
    name: Publish GHCR image
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wolt-mcp
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Set GHCR package visibility to public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/wolt-mcp/visibility" \
            -f visibility=public
