name: Go CI

on:
  pull_request:
    paths-ignore:
      - 'docs-site/**'
      - 'docs/**'
      - '**.md'
      - '.github/workflows/docs-ci.yml'
      - '.github/workflows/docs-deploy.yml'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs-site/**'
      - 'docs/**'
      - '**.md'
      - '.github/workflows/docs-ci.yml'
      - '.github/workflows/docs-deploy.yml'

jobs:
  test:
    name: Build, Lint, Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Resolve build version
        run: echo "BUILD_VERSION=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"

      - name: Build versioned CLI binary
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w -X main.version=${BUILD_VERSION}" -o bin/wolt ./cmd/wolt

      - name: Verify CLI version output
        run: |
          actual_version="$(./bin/wolt --version | tr -d '\r\n')"
          if [ -z "${actual_version}" ] || [ "${actual_version}" = "dev" ]; then
            echo "wolt --version returned invalid value: '${actual_version}'"
            exit 1
          fi
          if [ "${actual_version}" != "${BUILD_VERSION}" ]; then
            echo "wolt --version mismatch: expected '${BUILD_VERSION}', got '${actual_version}'"
            exit 1
          fi

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.4.0
          install-mode: goinstall

      - name: Unit and integration tests
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve build version
        run: echo "BUILD_VERSION=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"

      - name: Build image
        run: docker build --build-arg VERSION="${BUILD_VERSION}" -t wolt-mcp:ci .

      - name: Verify embedded version
        run: |
          actual="$(docker run --rm wolt-mcp:ci --version | tr -d '\r\n')"
          if [ "${actual}" != "${BUILD_VERSION}" ]; then
            echo "wolt-mcp --version mismatch: expected '${BUILD_VERSION}', got '${actual}'"
            exit 1
          fi

      - name: Healthz smoke
        run: |
          set -euo pipefail
          docker run -d --name wolt-mcp-ci \
            -e WOLT_MCP_TOKEN=ci-token \
            -e WOLT_MCP_LISTEN=0.0.0.0:8080 \
            -p 8080:8080 \
            wolt-mcp:ci
          trap 'docker rm -f wolt-mcp-ci >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then
              exit 0
            fi
            sleep 0.2
          done
          echo "healthz did not become ready"
          docker logs wolt-mcp-ci
          exit 1

      - name: Set up QEMU
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/wolt-mcp
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.BUILD_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Set GHCR package visibility to public
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/wolt-mcp/visibility" \
            -f visibility=public
